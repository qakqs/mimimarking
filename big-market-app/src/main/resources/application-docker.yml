server:
  port: 8091

thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

spring:
  datasource:
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1998}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:marketing}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15
    idle-timeout: 180000
    maximum-pool-size: 100
    auto-commit: true
    max-lifetime: 1800000
    connection-timeout: 30000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource
  rabbitmq:
    addresses: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin123}
    publisher-confirm-type: correlated
    listener:
      simple:
        prefetch: 1
        retry:
          max-attempts: 3
          enabled: true
    topic:
      activity_sku_stock_zero: activity_sku_stock_zero
      send_award: send_award
      send_rebate: send_rebate
      credit_adjust_success: credit_adjust_success

dubbo:
  application:
    name: marking
    version: 1.0
  registry:
    id: marking
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}
    group: marking
    parameters:
      namespace: ${NACOS_NAMESPACE:31d0c17d-9bc6-417e-adce-394cf99e2da8}
  protocol:
    name: dubbo
    port: -1

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

redis:
  sdk:
    config:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

jwt:
  secret: ${JWT_SECRET:big-market-jwt-secret-key-2024}
  ttl: ${JWT_TTL:86400000}

login:
  max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
  lock-minutes: ${LOGIN_LOCK_MINUTES:15}

logging:
  level:
    root: info
  config: classpath:logback-spring.xml
